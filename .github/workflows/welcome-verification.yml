name: Disposable welcome verification
on:
  push:
    branches: [docs/repository-welcome]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Install existing requirements in disposable environment
        run: |
          python3 -m venv /tmp/replace-verification-env
          /tmp/replace-verification-env/bin/python -m pip install -r requirements.txt
      - name: Verify source-defined local workflow using synthetic files
        run: |
          /tmp/replace-verification-env/bin/python - <<'PY'
          import json, tempfile, time, subprocess, socket, sys
          from pathlib import Path
          from urllib.request import urlopen, Request
          from services.batch_runtime import BatchRuntime
          from services.batch_queue import BatchQueueError
          with tempfile.TemporaryDirectory() as temp:
              root = Path(temp)
              source = root / "synthetic.png"
              source.write_bytes(b"synthetic queue fixture; no image processor")
              runtime = BatchRuntime(data_root=root / "state")
              config = runtime.load_workflow()
              assert config.enabled is False
              config.name = "Disposable verification"
              runtime.save_workflow(config)
              job = runtime.queue.enqueue_file("default", source)
              try:
                  runtime.queue.enqueue_file("default", source)
                  raise AssertionError("Duplicate accepted")
              except BatchQueueError:
                  pass
              again = BatchRuntime(data_root=root / "state")
              assert again.load_workflow().name == config.name
              assert again.queue.list_jobs("default")[0].id == job.id
              runtime.worker._process(job, config)
              failed = runtime.store.load_job(job.id)
              assert failed.status == "failed" and "No batch processor configured yet" in failed.error
              print("PASS queue persistence, duplicate rejection, unconfigured processor")
          sock = socket.socket()
          sock.bind(("127.0.0.1", 0))
          port = sock.getsockname()[1]
          sock.close()
          proc = subprocess.Popen([sys.executable, "-m", "uvicorn", "app:app", "--host", "127.0.0.1", "--port", str(port)])
          def request(path, method="GET", payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = Request(f"http://127.0.0.1:{port}" + path, data=data, method=method, headers={"Content-Type": "application/json"})
              with urlopen(req, timeout=5) as response:
                  assert response.status == 200
                  return json.load(response)
          try:
              for attempt in range(50):
                  try:
                      assert request("/api/health") == {"status": "ok"}
                      break
                  except OSError:
                      time.sleep(0.1)
              else:
                  raise AssertionError("API startup timed out")
              config = request("/api/workflows/default")
              assert config["enabled"] is False
              assert request("/api/workflows/default/status")["worker_running"] is False
              updated = request("/api/workflows/default", "PUT", {"name": "Disposable API verification"})
              assert updated["name"] == "Disposable API verification"
              assert request("/api/workflows/default/jobs") == []
              assert request("/api/workflows/default/start", "POST")["worker_running"] is True
              assert request("/api/workflows/default/pause", "POST")["worker_running"] is False
              assert request("/openapi.json")["info"]["title"] == "replace"
              print("PASS loopback startup, health, configuration, status, start, pause, OpenAPI")
              print("Python:", sys.version)
          finally:
              proc.terminate()
              proc.wait(timeout=10)
          PY
